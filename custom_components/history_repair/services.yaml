find_zero_values:
  name: Find zero values
  description: Scan entity history to detect intervals where values dropped to zero.
  fields:
    entity_id:
      name: Entity
      description: Entity ID(s) to scan for zero-value intervals.
      required: true
      selector:
        entity: {}
    start_time:
      name: Start Time
      description: Start of the scan interval (ISO format or datetime).
      required: false
      selector:
        datetime: {}
    end_time:
      name: End Time
      description: End of the scan interval (ISO format or datetime).
      required: false
      selector:
        datetime: {}

fix_zero_values:
  name: Fix zero values
  description: Repair zero value intervals in states and long-term statistics tables.
  fields:
    entity_id:
      name: Entity
      description: Entity ID(s) to repair zero-value intervals for.
      required: true
      selector:
        entity: {}
    start_time:
      name: Start Time
      description: Start of the repair interval.
      required: false
      selector:
        datetime: {}
    end_time:
      name: End Time
      description: End of the repair interval.
      required: false
      selector:
        datetime: {}
    dry_run:
      name: Dry Run
      description: Preview changes without committing to database (default true).
      required: false
      default: true
      selector:
        boolean: {}
    fix_statistics:
      name: Fix Statistics
      description: Repair long-term statistics tables along with states (default true).
      required: false
      default: true
      selector:
        boolean: {}

erase_history:
  name: Erase history
  description: Permanently delete an entity's raw states plus short-term and long-term statistics. Dry run defaults to true and deletes nothing.
  fields:
    entity_id:
      name: Entity
      description: Entity ID(s) whose history will be erased.
      required: true
      selector:
        entity: {}
    start_time:
      name: Start Time
      description: Start of the erase interval (ISO format or datetime).
      required: false
      selector:
        datetime: {}
    end_time:
      name: End Time
      description: End of the erase interval (ISO format or datetime).
      required: false
      selector:
        datetime: {}
    dry_run:
      name: Dry Run
      description: Count matching rows without deleting anything (default true). Set false to permanently delete.
      required: false
      default: true
      selector:
        boolean: {}
